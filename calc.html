<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator JS windows alert</title>
</head>
<body>

<script>
    let num1 = parseFloat(prompt("Masukkan angka pertama:"));
    let operator = prompt("pilih operator bilangan (+, -, *, /):");
    let num2 = parseFloat(prompt("Masukkan angka pertama kedua:"));

    let result;

    if (operator === "+") {
        result = num1 + num2;
    } 
    else if (operator === "-") {
        result = num1 - num2;
    } 
    else if (operator === "*") {
        result = num1 * num2;
    } 
    else if (operator === "/") {
        result = num1 / num2;
    } 
    else {
        result = "Invalid operator!";
    }

    alert("Result: " + result);
</script>

</body>
</html>
